# Local development stack: MySQL + Elasticsearch + the iHub backend.
#
# Credentials come from a sibling `.env` file (copy `.env.example`), so no secret is
# committed here. The previous version hardcoded root/root and elastic123, and never
# set JWT_SECRET at all — meaning `docker compose up` failed at startup on an
# unresolved placeholder.

services:
  db:
    image: mysql:8.1
    container_name: ihub-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ihub}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - ihub_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${MYSQL_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: ihub-elasticsearch
    environment:
      - node.name=es01
      - discovery.type=single-node
      - cluster.name=ihub-cluster
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD in .env}
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - '${ES_PORT:-9200}:9200'
    volumes:
      - ihub_es_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        ['CMD-SHELL', 'curl -fsS -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  backend:
    build: .
    image: ihub-backend
    container_name: ihub-backend
    ports:
      - '${PORT:-8081}:8081'
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # Property names match application.yaml's placeholders exactly, so there is
      # one obvious place to look when a value does not take effect.
      DB_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-ihub}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      ES_URL: http://elasticsearch:9200
      ES_USERNAME: elastic
      ES_PASSWORD: ${ELASTIC_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (min 32 chars)}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@ihub.com}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ihub_mysql_data:
  ihub_es_data:
