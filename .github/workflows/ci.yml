name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push supersedes an in-flight run on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Compile
        run: mvn -B -ntp clean compile

      # The suite runs on in-memory H2 with schedulers disabled, so no MySQL or
      # Elasticsearch service container is required.
      - name: Test
        run: mvn -B -ntp test

      - name: Package
        run: mvn -B -ntp package -DskipTests

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ihub-backend-jar
          path: server/target/*.jar
          retention-days: 7

  frontend:
    name: Frontend · lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # `next build` type-checks the whole project, so this covers tsc as well.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8081
          NEXT_PUBLIC_WS_URL: http://localhost:8081/ws

  docker:
    name: Backend · docker image
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - uses: actions/checkout@v4

      # Builds only — verifies the Dockerfile stays valid; publishing is left to
      # the deployment pipeline.
      - name: Build image
        run: docker build -t ihub-backend:${{ github.sha }} server
